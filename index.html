<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>의학용어 발음 검색</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{--bg:#fffbe3;--card:#fff;--ink:#12343b;--sub:#5b7a80;--ac:#1f9d8f;--acd:#157a6f;--line:#cfe6e1;--soft:#d9f0eb;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.6}
main{max-width:520px;margin:0 auto;padding:28px 18px 48px}
h1{font-size:22px;margin:0 0 4px}
.lead{margin:0 0 18px;color:var(--sub);font-size:15px}
.search{display:flex;gap:8px}
input{flex:1;min-width:0;font:inherit;font-size:17px;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:14px;padding:13px 15px}
input:focus-visible,button:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.go{font:inherit;font-size:16px;border:0;border-radius:14px;background:var(--ac);color:#fff;padding:0 18px;cursor:pointer}
.sug{display:flex;flex-direction:column;margin-top:8px;background:var(--card);border-radius:14px;border:1px solid var(--line);overflow:hidden}
.sug button{font:inherit;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:11px 15px;color:var(--ink);cursor:pointer;display:flex;justify-content:space-between;gap:10px}
.sug button:last-child{border-bottom:0}
.sug span{color:var(--sub);font-size:14px}
.res{margin-top:22px;background:var(--card);border-radius:22px;border:1px solid var(--line);padding:26px 22px;text-align:center}
.term{font-size:clamp(28px,9vw,40px);font-weight:700;word-break:break-word;margin:0}
.play{margin:18px auto 0;display:flex;align-items:center;justify-content:center;gap:10px;font:inherit;font-size:17px;border:0;border-radius:999px;background:var(--ac);color:#fff;padding:14px 28px;cursor:pointer;transition:transform .15s}
.play:active{transform:scale(.96)}
.play.on{background:var(--acd)}
.slow{display:block;margin:10px auto 0;font:inherit;font-size:14px;color:var(--sub);background:none;border:0;text-decoration:underline;cursor:pointer}
.ipa{margin:22px 0 0}
.ipa small{display:block;color:var(--sub);font-size:13px}
.ipa b{display:block;font-weight:400;font-size:clamp(20px,6vw,26px);margin-top:2px;font-family:"Segoe UI","Noto Sans","Lucida Sans Unicode","DejaVu Sans",sans-serif;word-break:break-word}
.ko{margin:18px 0 0;padding-top:18px;border-top:1px dashed var(--line)}
.ko small{display:block;color:var(--sub);font-size:13px}
.ko b{display:block;font-size:clamp(24px,7.5vw,32px);color:var(--acd);margin-top:2px}
.mean{margin:10px 0 0;font-size:16px;color:var(--sub)}
.add{margin-top:14px;display:flex;gap:8px}
.add input{font-size:16px;padding:10px 12px}
.add button{font:inherit;border:0;border-radius:12px;background:var(--soft);color:var(--ink);padding:0 16px;cursor:pointer}
.note{font-size:14px;color:var(--sub);margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.chips p{width:100%;margin:0;color:var(--sub);font-size:14px}
.chips button{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 14px;cursor:pointer}
.warn{margin-top:12px;color:#c0392b;font-size:14px}
@media (prefers-reduced-motion:reduce){.play{transition:none}}
</style>
</head>
<body>
<main>
  <h1>의학용어 발음 검색</h1>
  <p class="lead">영어 의학용어를 검색하면 발음을 들려주고 한글로 읽는 법을 알려줘요.</p>
  <div class="search">
    <input id="q" type="search" placeholder="예: hypertension 또는 고혈압" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="의학용어 검색">
    <button class="go" id="go">검색</button>
  </div>
  <div id="sug" class="sug" hidden></div>
  <div id="out"></div>
  <div class="chips" id="chips"><p>자주 찾는 용어</p></div>
  <div id="warn" class="warn" hidden>이 기기에서는 음성 재생을 지원하지 않아요.</div>
</main>
<script>
var D=[
["hypertension","하이퍼텐션","고혈압","ˌhaɪpərˈtɛnʃən"],["hypotension","하이포텐션","저혈압","ˌhaɪpoʊˈtɛnʃən"],["tachycardia","태키카디아","빈맥","ˌtækɪˈkɑːrdiə"],["bradycardia","브래디카디아","서맥","ˌbrædɪˈkɑːrdiə"],
["dyspnea","디스프니아","호흡곤란","dɪspˈniːə"],["tachypnea","택입니아","빈호흡","ˌtækɪpˈniːə"],["pneumonia","뉴모니아","폐렴","nuːˈmoʊniə"],["asthma","애즈마","천식","ˈæzmə"],
["bronchitis","브롱카이티스","기관지염","brɑːnˈkaɪtɪs"],["diabetes mellitus","다이어비티스 멜리터스","당뇨병","ˌdaɪəˈbiːtiːz məˈlaɪtəs"],["hyperglycemia","하이퍼글라이시미아","고혈당","ˌhaɪpərɡlaɪˈsiːmiə"],
["hypoglycemia","하이포글라이시미아","저혈당","ˌhaɪpoʊɡlaɪˈsiːmiə"],["edema","이디마","부종","ɪˈdiːmə"],["anemia","어니미아","빈혈","əˈniːmiə"],["myocardial infarction","마이오카디얼 인팍션","심근경색","ˌmaɪoʊˈkɑːrdiəl ɪnˈfɑːrkʃən"],
["stroke","스트로크","뇌졸중","stroʊk"],["cyanosis","사이어노시스","청색증","ˌsaɪəˈnoʊsɪs"],["hematuria","히머투리아","혈뇨","ˌhiːməˈtʊriə"],["oliguria","알리규리아","핍뇨","ˌɑːlɪˈɡjʊriə"],
["nausea","노지아","오심","ˈnɔːziə"],["vomiting","보미팅","구토","ˈvɑːmɪtɪŋ"],["diarrhea","다이어리아","설사","ˌdaɪəˈriːə"],["constipation","칸스티페이션","변비","ˌkɑːnstɪˈpeɪʃən"],["jaundice","전디스","황달","ˈdʒɔːndɪs"],
["fever","피버","발열","ˈfiːvər"],["pain","페인","통증","peɪn"],["appendicitis","어펜디사이티스","충수염","əˌpɛndəˈsaɪtɪs"],["gastritis","개스트라이티스","위염","ɡæˈstraɪtɪs"],["hepatitis","헤퍼타이티스","간염","ˌhɛpəˈtaɪtɪs"],
["nephritis","네프라이티스","신염","nɪˈfraɪtɪs"],["arthritis","아쓰라이티스","관절염","ɑːrˈθraɪtɪs"],["osteoporosis","아스티오퍼로시스","골다공증","ˌɑːstioʊpəˈroʊsɪs"],["fracture","프랙처","골절","ˈfræktʃər"],
["hemorrhage","헤머리지","출혈","ˈhɛmərɪdʒ"],["thrombosis","쓰롬보시스","혈전증","θrɑːmˈboʊsɪs"],["embolism","엠벌리즘","색전증","ˈɛmbəlɪzəm"],["ischemia","이스키미아","허혈","ɪˈskiːmiə"],
["aspiration","애스퍼레이션","흡인","ˌæspəˈreɪʃən"],["catheter","캐서터","카테터","ˈkæθətər"],["dehydration","디하이드레이션","탈수","ˌdiːhaɪˈdreɪʃən"],["sepsis","셉시스","패혈증","ˈsɛpsɪs"],
["hypoxia","하이폭시아","저산소증","haɪˈpɑːksiə"],["tracheostomy","트레이키아스터미","기관절개술","ˌtreɪkiˈɑːstəmi"],["anesthesia","애니스띠지아","마취","ˌænəsˈθiːʒə"]
];
var CH=["hypertension","pneumonia","edema","dyspnea","sepsis","cyanosis"];
var $=function(i){return document.getElementById(i)};
var q=$("q"),sug=$("sug"),out=$("out"),warn=$("warn");
var saved={};
try{saved=JSON.parse(localStorage.getItem("mypron")||"{}")}catch(e){}
var TTS="speechSynthesis" in window;
if(!TTS)warn.hidden=false;

function find(t){t=t.trim().toLowerCase();return D.filter(function(d){return d[0].indexOf(t)>-1||d[2].indexOf(t)>-1})}
function speak(t,rate,btn){
  if(!TTS)return;
  speechSynthesis.cancel();
  var u=new SpeechSynthesisUtterance(t.replace(/[\/\-]/g,""));u.lang="en-US";u.rate=rate;
  var v=speechSynthesis.getVoices().filter(function(x){return x.lang&&x.lang.indexOf("en")===0});
  var us=v.filter(function(x){return x.lang==="en-US"});
  if(us.length)u.voice=us[0];
  if(btn){btn.classList.add("on");u.onend=u.onerror=function(){btn.classList.remove("on")}}
  speechSynthesis.speak(u);
}
function esc(s){return s.replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

function show(term,known){
  sug.hidden=true;
  var key=term.toLowerCase(),ko,mean="",ipa="";
  if(known){ko=known[1];mean=known[2];ipa=known[3]||"";term=known[0]}
  else if(saved[key]){ko=saved[key]}
  var h='<div class="res"><p class="term">'+esc(term)+'</p>'+
  '<button class="play" id="p" aria-label="발음 듣기">&#9654; 발음 듣기</button>'+
  '<button class="slow" id="s">천천히 듣기</button>';
  if(ipa)h+='<div class="ipa"><small>영어발음</small><b>['+esc(ipa)+']</b></div>';
  if(ko){h+='<div class="ko"><small>한글발음</small><b>'+esc(ko)+'</b></div>'+(mean?'<p class="mean">'+esc(mean)+'</p>':'')}
  else{h+='<div class="ko"><p class="note">아직 한글발음이 없는 용어예요. 직접 적어서 저장할 수 있어요.</p>'+
  '<div class="add"><input id="k" placeholder="한글발음 입력" aria-label="한글발음 입력"><button id="sv">저장</button></div></div>'}
  out.innerHTML=h+'</div>';
  $("p").onclick=function(){speak(term,.9,this)};
  $("s").onclick=function(){speak(term,.5,$("p"))};
  if($("sv"))$("sv").onclick=function(){
    var v=$("k").value.trim();if(!v)return;
    saved[key]=v;try{localStorage.setItem("mypron",JSON.stringify(saved))}catch(e){}
    show(term,null);
  };
}
function suggest(){
  var v=q.value.trim();
  if(!v){sug.hidden=true;return}
  var m=find(v).slice(0,6);
  if(!m.length){sug.hidden=true;return}
  sug.innerHTML="";
  m.forEach(function(d){
    var b=document.createElement("button");
    b.innerHTML=esc(d[0])+"<span>"+esc(d[2])+"</span>";
    b.onclick=function(){q.value=d[0];show(d[0],d)};
    sug.appendChild(b);
  });
  sug.hidden=false;
}
function run(){
  var v=q.value.trim();if(!v)return;
  var m=find(v),ex=m.filter(function(d){return d[0]===v.toLowerCase()||d[2]===v})[0];
  if(ex)show(ex[0],ex);
  else if(m.length===1)show(m[0][0],m[0]);
  else if(m.length>1)suggest();
  else if(/[a-z]/i.test(v))show(v,null);
  else{out.innerHTML='<div class="res"><p class="note">영어 용어로 검색해 주세요. 예: hypertension</p></div>'}
}
q.addEventListener("input",suggest);
q.addEventListener("keydown",function(e){if(e.key==="Enter")run()});
$("go").onclick=run;
CH.forEach(function(t){
  var b=document.createElement("button");b.textContent=t;
  b.onclick=function(){q.value=t;show(t,find(t)[0])};
  $("chips").appendChild(b);
});
if(TTS)speechSynthesis.onvoiceschanged=function(){};
</script>
</body>
</html>
